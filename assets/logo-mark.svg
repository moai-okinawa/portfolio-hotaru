<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="音速のホタル ロゴマーク">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fbffd6"/>
      <stop offset="0.35" stop-color="#e4ff5c"/>
      <stop offset="1" stop-color="#b6f23a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#e4ff5c"/>
      <stop offset="1" stop-color="#e4ff5c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cone" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7df9ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7df9ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="#08120e" stroke="#e4ff5c" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- mach cone -->
  <path d="M92 60 L22 26" stroke="url(#cone)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M92 60 L22 94" stroke="url(#cone)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- shock rings -->
  <path d="M76 42 Q66 60 76 78" stroke="#7df9ff" stroke-opacity="0.55" stroke-width="1.6" fill="none"/>
  <path d="M64 36 Q52 60 64 84" stroke="#7df9ff" stroke-opacity="0.35" stroke-width="1.4" fill="none"/>
  <path d="M52 31 Q38 60 52 89" stroke="#7df9ff" stroke-opacity="0.2" stroke-width="1.2" fill="none"/>
  <!-- speed trails -->
  <path d="M60 60 H12" stroke="url(#trail)" stroke-width="3" stroke-linecap="round"/>
  <path d="M58 52 H26" stroke="url(#trail)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M58 68 H30" stroke="url(#trail)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- firefly -->
  <circle cx="66" cy="60" r="20" fill="url(#glow)"/>
  <ellipse cx="80" cy="52" rx="11" ry="4" transform="rotate(-24 80 52)" fill="#dff7ff" fill-opacity="0.55"/>
  <ellipse cx="80" cy="68" rx="11" ry="4" transform="rotate(24 80 68)" fill="#dff7ff" fill-opacity="0.55"/>
  <ellipse cx="78" cy="60" rx="12" ry="5.5" fill="#1d2b22"/>
  <circle cx="91" cy="60" r="4.2" fill="#1d2b22"/>
  <path d="M93 57 Q99 50 104 49 M93 63 Q99 70 104 71" stroke="#1d2b22" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="66" cy="60" rx="7" ry="5.2" fill="#f4ff9a"/>
</svg>
